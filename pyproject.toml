[project]
name = "pokerlab"
version = "0.1.0"
description = "Personal poker audit, trainer and coach for Betclic NL5 cash"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1", "pyarrow>=17.0", "pytz", "rich>=13.0",
    "fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.9",
]

[project.scripts]
pokerlab = "pokerlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
